[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bonoxauto"
version = "0.1.0"
description = "Telegram-бот для автопокупок на bonoxs.com по расписанию"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
bonoxauto = "bonoxauto.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["bonoxauto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
# Кириллица в строках и комментариях — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]
